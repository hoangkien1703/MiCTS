name: ColorOS Preview APK

on:
  push:
    branches: [fix/coloros-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coloros-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: micts-preview-debug-key-v1
      - name: Build and test preview
        run: ./gradlew :app:testMiCTSPreviewUnitTest :app:assembleMiCTSPreview --no-daemon
      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find app/build/outputs/apk/MiCTS/preview -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" dist/MiCTS-Preview-ColorOS.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose dist/MiCTS-Preview-ColorOS.apk
          "$build_tools/aapt2" dump badging dist/MiCTS-Preview-ColorOS.apk > dist/apk-info.txt
          grep -q "package: name='com.parallelc.micts.preview'" dist/apk-info.txt
          grep -q "application-label:'MiCTS Preview'" dist/apk-info.txt
          grep -q "versionCode='1002'" dist/apk-info.txt
          "$build_tools/aapt2" dump xmltree dist/MiCTS-Preview-ColorOS.apk --file res/xml/shortcuts.xml > dist/shortcuts.txt
          grep -q 'com.parallelc.micts.preview' dist/shortcuts.txt
          (cd dist && sha256sum MiCTS-Preview-ColorOS.apk > SHA256SUMS.txt)
      - name: Verify update compatibility with preview 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download coloros-preview-3-1 --pattern MiCTS-Preview-ColorOS.apk --dir previous
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          previous_cert=$("$build_tools/apksigner" verify --print-certs previous/MiCTS-Preview-ColorOS.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          current_cert=$("$build_tools/apksigner" verify --print-certs dist/MiCTS-Preview-ColorOS.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$previous_cert"
          test "$previous_cert" = "$current_cert"
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-test-reports
          path: app/build/reports/tests/testMiCTSPreviewUnitTest/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: MiCTS-Preview-ColorOS
          path: dist/
          if-no-files-found: error
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="coloros-preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/MiCTS-Preview-ColorOS.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MiCTS Preview — ColorOS (build ${GITHUB_RUN_NUMBER})" \
            --notes-file docs/coloros-preview.md
