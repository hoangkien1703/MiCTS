name: Build ColorOS compatibility APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/oneplus-ace5-coloros16

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        run: ./gradlew :app:assembleMiCTSDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiCTS-OnePlus-Ace5-ColorOS16
          path: app/build/outputs/apk/MiCTS/debug/*.apk
          if-no-files-found: error
          retention-days: 30
